<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  {% include head.html %}
  <body{% if page.url == '/' %} class="home"{% endif %}>
    <header class="site-header">
      <div class="wrapper">
        <a class="site-title" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }}">
          <img
            src="{{ '/assets/images/header.svg' | relative_url }}"
            alt="{{ site.title | escape }}"
            class="site-logo"
            width="48"
            height="48"
          >
        </a>

        <!-- Hamburger button (small screens) -->
        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-nav">&#9776;</button>

        <nav class="site-nav" id="site-nav">
          <div class="trigger">
            <a class="page-link" href="{{ "/" | relative_url }}">Home</a>
            <a class="page-link" href="{{ "/archive" | relative_url }}">Blog</a>
            <a class="page-link" href="{{ "/projects/" | relative_url }}">Projects</a>
            <a class="page-link" href="{{ "/cv/" | relative_url }}">CV</a>
          </div>
        </nav>
      </div>
    </header>

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrapper">
        <div class="footer-col-wrapper">
          <div class="footer-col">
            <p>{{ site.description | escape }}</p>
          </div>
          <div class="footer-col">
            {%- include social.html -%}
          </div>
        </div>
      </div>
    </footer>

    <script>
      (function () {
        // Mobile menu toggle
        var toggle = document.querySelector(".nav-toggle");
        var nav = document.querySelector(".site-nav");
        toggle.addEventListener("click", function () {
          var open = nav.classList.toggle("active");
          toggle.setAttribute("aria-expanded", open ? "true" : "false");
        });

        // Let the browser pick text direction per element (Farsi = right-to-left, English = left-to-right)
        document
          .querySelectorAll(".page-content p, .page-content li, .page-content blockquote, .page-content h1, .page-content h2, .page-content h3, .page-content h4")
          .forEach(function (el) { el.setAttribute("dir", "auto"); });
      })();
    </script>
  </body>
</html>
