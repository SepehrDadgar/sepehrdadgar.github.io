theme: "minima"

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:path/

# Defaults
# NOTE: a YAML file can only have one top-level `defaults:` key. Both
# scoped rules (CV page + post tags) live in this single list now --
# previously there were two separate `defaults:` blocks and the second
# one was silently overwriting the first, so the CV page's layout/title/
# permalink defaults were never actually being applied.
defaults:
  - scope:
      path: "cv"
      type: pages
    values:
      layout: page
      title: "CV"
      permalink: /cv/
  - scope:
      type: posts
    values:
      tags: Other

rss: rss

kramdown:
  syntax_highlighter_opts:
    disable: true

plugins:
  - jekyll-feed
  - jekyll-sitemap

titles_from_headings:
  strip_title: true
  collections: true
