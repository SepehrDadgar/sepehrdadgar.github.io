<!-- Site build date: {{ "now" | date: "%FT%T%z" }} -->
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo %}

  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/js/highlightjs/styles/github.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/override.css' | relative_url }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazir-font@30.1.0/dist/font-face.css">
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">

  {% feed_meta %}

  {% if jekyll.environment == 'production' and site.google_analytics -%}
  <!-- Begin Google Analytics -->
  {% include google-analytics.html %}
  <!-- End Google Analytics -->
  {%- endif %}

  <!-- Code highlighting (highlight.js, self-hosted). Only blocks with a language, e.g. ```bash, get coloured. -->
  <script src="{{ '/js/highlightjs/highlight.min.js' | relative_url }}" defer></script>
  <script src="{{ '/js/highlightjs/languages/verilog.min.js' | relative_url }}" defer></script>
  <script src="{{ '/js/highlightjs/languages/tcl.min.js' | relative_url }}" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (!window.hljs) return;
      document.querySelectorAll('pre code[class*="language-"]').forEach(function (el) {
        hljs.highlightElement(el);
      });
    });
  </script>

  {% if page.math %}
  <!-- Equations (MathJax): add "math: true" to a post's front matter to enable -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>
  {% endif %}
</head>
